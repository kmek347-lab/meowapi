<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Donut Stats</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Inter',sans-serif;
}

body{
background:#050505;
color:white;
min-height:100vh;
padding:24px;
overflow-x:hidden;
}

.container{
max-width:1500px;
margin:auto;
}

.hero{
position:relative;
overflow:hidden;
border-radius:30px;
padding:38px;

background:
radial-gradient(circle at top left,
rgba(255,120,0,.12),
transparent 30%),

linear-gradient(
135deg,
#0b0b0c 0%,
#050505 70%
);

border:1px solid rgba(255,255,255,.05);
}

/* SERVERS */

.server-select{
display:flex;
gap:24px;
margin-bottom:26px;
align-items:center;
}

.server{
position:relative;
display:flex;
align-items:center;
gap:12px;
cursor:pointer;
transition:.25s;
overflow:hidden;
}

.server:hover{
transform:translateY(-2px);
}

.server::before{
content:'';

position:absolute;
left:-10px;
right:-10px;
bottom:-4px;

height:2px;

background:
linear-gradient(
90deg,
transparent,
rgba(255,255,255,.95),
transparent
);

transform:translateX(-120%);
animation:serverShine 3s linear infinite;
}

@keyframes serverShine{
100%{
transform:translateX(120%);
}
}

.server img{
width:30px;
height:30px;
object-fit:contain;
}

.server span{
font-size:20px;
font-weight:700;

background:
linear-gradient(
90deg,
#ffffff,
#d9d9d9,
#ffffff
);

-webkit-background-clip:text;
-webkit-text-fill-color:transparent;
}

/* TOP */

.top{
display:flex;
align-items:center;
justify-content:space-between;
gap:40px;
}

.left{
flex:1;
display:flex;
flex-direction:column;
justify-content:center;
}

.name{
font-size:72px;
font-weight:800;
line-height:1;
letter-spacing:-4px;
margin-bottom:24px;
min-height:82px;
}

/* SEARCH */

.search-wrap{
display:flex;
align-items:center;
gap:14px;
max-width:760px;
}

.search-box{
position:relative;
flex:1;
}

.search-icon{
position:absolute;
left:22px;
top:50%;
transform:translateY(-50%);
font-size:20px;
opacity:.6;
}

.search-box input{
width:100%;
height:72px;

padding:0 24px 0 60px;

background:
linear-gradient(
180deg,
rgba(255,255,255,.03),
rgba(255,255,255,.015)
);

border:1px solid rgba(255,255,255,.06);

border-radius:8px;

color:white;

font-size:18px;
font-weight:600;

outline:none;

transition:.25s;
}

.search-box input:focus{

border-color:rgba(0,153,255,.6);

box-shadow:
0 0 0 4px rgba(0,153,255,.12);

}

.search-box input::placeholder{
color:#8f8f8f;
font-weight:500;
}

button{
position:relative;

height:72px;

padding:0 34px;

border:none;

border-radius:2px;

overflow:hidden;

background:
linear-gradient(
135deg,
#0066ff,
#00a2ff
);

color:white;

font-size:17px;
font-weight:800;

cursor:pointer;

transition:.25s;
}

button::before{
content:'';

position:absolute;
inset:0;

background:
linear-gradient(
90deg,
transparent,
rgba(255,255,255,.22),
transparent
);

transform:translateX(-120%);
}

button:hover::before{
animation:btnShine .9s linear;
}

@keyframes btnShine{
100%{
transform:translateX(120%);
}
}

button:hover{
transform:translateY(-2px);
}

/* SKIN */

.skin{
width:270px;

order:-1;

filter:
drop-shadow(0 0 40px rgba(255,255,255,.08));

animation:float 5s ease-in-out infinite;
}

@keyframes float{

0%{
transform:translateY(0px);
}

50%{
transform:translateY(-8px);
}

100%{
transform:translateY(0px);
}

}

/* STATS */

.stats{
display:grid;

grid-template-columns:
repeat(auto-fit,minmax(240px,1fr));

gap:20px;

margin-top:38px;
}

.card{
position:relative;

padding:28px;

border-radius:24px;

overflow:hidden;

background:
linear-gradient(
180deg,
rgba(255,255,255,.025),
rgba(255,255,255,.015)
);

border:1px solid rgba(255,255,255,.06);

transition:.25s;
}

.card:hover{
transform:translateY(-3px);
border-color:rgba(255,255,255,.12);
}

.card::before{
content:'';

position:absolute;
inset:0;

background:
linear-gradient(
90deg,
transparent,
rgba(255,255,255,.03),
transparent
);

transform:translateX(-100%);
transition:1s;
}

.card:hover::before{
transform:translateX(100%);
}

.label{
display:flex;
align-items:center;
gap:12px;

font-size:14px;
font-weight:700;
letter-spacing:1px;

text-transform:uppercase;

margin-bottom:24px;
}

.label img{
width:26px;
height:26px;
object-fit:contain;
}

.value{
font-size:58px;
font-weight:800;
letter-spacing:-2px;
line-height:1;

word-break:break-word;
}

/* COLORS */

.money{color:#e8bc42}
.shards{color:#9f72ff}
.playtime{color:#589cff}
.kills{color:#ff6d6d}
.deaths{color:#d7d7d7}
.placed{color:#50e791}
.broken{color:#e28a46}
.mobs{color:#47dfaa}

.loading,
.error{
margin-top:18px;
font-size:17px;
font-weight:500;
}

.error{
color:#ff6b6b;
}

/* MOBILE */

@media(max-width:900px){

body{
padding:12px;
}

.hero{
padding:20px;
border-radius:22px;
}

.server-select{
gap:16px;
margin-bottom:20px;
}

.server span{
font-size:16px;
}

.top{
flex-direction:column;
align-items:center;
text-align:center;
gap:22px;
}

.left{
width:100%;
align-items:center;
}

.skin{
width:160px;
max-width:70vw;
}

.name{
font-size:42px;
letter-spacing:-2px;
margin-bottom:18px;
min-height:auto;
}

.search-wrap{
width:100%;
flex-direction:column;
gap:12px;
}

.search-box{
width:100%;
}

.search-box input{
height:62px;
font-size:16px;
padding-left:54px;
}

button{
width:100%;
height:62px;
font-size:16px;
border-radius:2px;
}

.stats{
grid-template-columns:repeat(2,1fr);
gap:14px;
margin-top:26px;
}

.card{
padding:18px;
border-radius:18px;
}

.value{
font-size:26px;
}

.label{
font-size:12px;
gap:8px;
margin-bottom:12px;
}

.label img{
width:20px;
height:20px;
}

.loading,
.error{
font-size:15px;
}

}

</style>
</head>

<body>

<div class="container">

<div class="hero">

<div class="server-select">

<div class="server">

<img src="https://website.donutsmp.org/bcGCsev.png">

<span>DonutSMP</span>

</div>

<div class="server"
onclick="alert('Coming Soon...')">

<img src="https://static.wikia.nocookie.net/logopedia/images/9/9f/Hypixel_2015_%28Icon%29.png/revision/latest?cb=20221026120925">

<span>Hypixel</span>

</div>

</div>

<div class="top">

<img
id="skin"
class="skin"
src="https://vzge.me/bust/lovehutao1.png?autocrop">

<div class="left">

<div id="playerName" class="name">
DonutSMP
</div>

<div class="search-wrap">

<div class="search-box">

<div class="search-icon">
⌕
</div>

<input
id="username"
placeholder="Search Minecraft username...">

</div>

<button onclick="fetchStats()">
Search
</button>

</div>

<div id="loading" class="loading"></div>
<div id="error" class="error"></div>

</div>

</div>

<div id="stats" class="stats"></div>

</div>

</div>

<script>

const icons={

money:'https://ccvaults.com/assets/10.%20Items/11.%20Materials/Emerald.png',

shards:'https://ccvaults.com/assets/10.%20Items/21.%20Decoration/Amethyst_Shard.png',

playtime:'https://minecraft.wiki/images/Compass_JE3_BE3.gif?0043f&format=original',

kills:'https://minecraft.wiki/images/Enchanted_Diamond_Sword.gif?f741f&format=original',

deaths:'https://ccvaults.com/assets/80.%20Particles/raid_omen.png',

placed_blocks:'https://ccvaults.com/assets/20.%20Blocks/18.%20Decoration/Grass_Block.png',

broken_blocks:'https://minecraft.wiki/images/Enchanted_Diamond_Pickaxe.gif?c7aaa&format=original',

mobs_killed:'https://ccvaults.com/assets/80.%20Particles/trial_omen.png'

};

/* TYPING EFFECT */

const typingWords=[
'DonutSMP',
'Hypixel'
];

let typingIndex=0;
let charIndex=0;
let deleting=false;

function typingEffect(){

const element=
document.getElementById('playerName');

const current=
typingWords[typingIndex];

if(!deleting){

element.innerText=
current.substring(0,charIndex++);

if(charIndex>current.length){

deleting=true;

setTimeout(typingEffect,1200);

return;

}

}else{

element.innerText=
current.substring(0,charIndex--);

if(charIndex<0){

deleting=false;

typingIndex=
(typingIndex+1)%typingWords.length;

}

}

setTimeout(
typingEffect,
deleting ? 45 : 90
);

}

/* FETCH */

async function fetchStats(){

const username=document
.getElementById('username')
.value.trim();

const stats=document.getElementById('stats');

const loading=document.getElementById('loading');

const error=document.getElementById('error');

if(!username){

error.innerText='Enter username';
return;

}

loading.innerText='Loading stats...';

error.innerText='';

stats.innerHTML='';

try{

const api=
'https://donutstats.co/api.php?path=%2Fstats%2F'
+encodeURIComponent(username);

let response;

try{

response=await fetch(api);

if(!response.ok){
throw new Error();
}

}catch(e){

response=await fetch(
'https://corsproxy.io/?'+
encodeURIComponent(api)
);

}

const data=await response.json();

loading.innerText='';

if(!data || !data.result){

error.innerText='Player not found';
return;

}

const s=data.result;

document.getElementById('skin')
.src='https://vzge.me/bust/'+
username+
'.png?autocrop';

const cards=[

['money','Money',money(s.money),'money'],

['shards','Shards',
shorten(s.shards),'shards'],

['playtime','Playtime',
playtime(s.playtime),'playtime'],

['kills','Kills',
shorten(s.kills),'kills'],

['deaths','Deaths',
shorten(s.deaths),'deaths'],

['placed_blocks','Blocks Placed',
shorten(s.placed_blocks),'placed'],

['broken_blocks','Blocks Broken',
shorten(s.broken_blocks),'broken'],

['mobs_killed','Mobs Killed',
shorten(s.mobs_killed),'mobs']

];

stats.innerHTML='';

for(let i=0;i<cards.length;i++){

const c=cards[i];

stats.innerHTML +=

'<div class="card">'+

'<div class="label '+c[3]+'">'+

'<img src="'+icons[c[0]]+'">'+

c[1]+

'</div>'+

'<div class="value">'+

c[2]+

'</div>'+

'</div>';

}

}catch(err){

loading.innerText='';

error.innerText='Failed to fetch API';

console.log(err);

}

}

function shorten(num){
    if (num === null || num === undefined) return '0';
    
    let cleanNum = String(num).replace(/,/g, '').trim();
    let n = parseFloat(cleanNum);
    
    if (isNaN(n)) return '0';
    
    let abs = Math.abs(n);
    
    if(abs >= 1e12){
        return (n / 1e12).toFixed(1).replace(/\.0$/, '') + 'T';
    }
    if(abs >= 1e9){
        return (n / 1e9).toFixed(1).replace(/\.0$/, '') + 'B';
    }
    if(abs >= 1e6){
        return (n / 1e6).toFixed(1).replace(/\.0$/, '') + 'M';
    }
    if(abs >= 1e3){
        return (n / 1e3).toFixed(1).replace(/\.0$/, '') + 'K';
    }
    
    return n.toString();
}

function money(num){
    return '$' + shorten(num);
}

function playtime(ms){
    if (!ms) return '0h 0m';
    let sec=Math.floor(Number(ms)/1000);
    let h=Math.floor(sec/3600);
    let m=Math.floor((sec-h*3600)/60);
    return h+'h '+m+'m'
}

typingEffect();

document
.getElementById('username')
.addEventListener('keypress',function(e){

if(e.key==='Enter'){
fetchStats()
}

});

</script>

</body>
</html>
